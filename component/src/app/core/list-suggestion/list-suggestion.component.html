<div class="container">
  <h1 class="page-title">Liste des suggestions</h1>
  
  <div class="search-container">
    <input 
      type="text" 
      [(ngModel)]="searchText" 
      placeholder="Rechercher des suggestions"
      class="search-input">
  </div>
  
  <div class="suggestions-list">
    <div class="suggestion-card" *ngFor="let s of getFilteredSuggestions()">
      
      <div class="card-header">
        <div>
          <h2 class="suggestion-title">{{ s.title }}</h2>
          <div class="suggestion-meta">
            <span class="category-badge">{{ s.category }}</span>
            <span class="date-text">{{ s.date | date: 'dd MMM yyyy' }}</span>
          </div>
        </div>
        <span class="status-badge" [ngClass]="{
          'status-accepte': s.status === 'acceptee',
          'status-refuse': s.status === 'refusee',
          'status-attente': s.status === 'en_attente'
        }">
          {{ s.status }}
        </span>
      </div>

      <div class="card-body">
        <p class="suggestion-description">{{ s.description }}</p>
        
        <div class="card-actions" *ngIf="s.status !== 'refusee'">
          <button class="btn-like" (click)="incrementLikes(s)">
            👍 Like {{ s.likes }}
          </button>
          
          <button class="btn-favorite" (click)="addToFavorites(s)">
            {{ isFavorite(s) ? '⭐ Déjà en favoris' : '🤍 Ajouter aux favoris' }}
          </button>
        </div>
      </div>

    </div>
  </div>

  <div class="no-results" *ngIf="getFilteredSuggestions().length === 0 && searchText.trim() !== ''">
    <p>Aucune suggestion trouvée pour "{{ searchText }}".</p>
  </div>

</div>
