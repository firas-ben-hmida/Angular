<div class="container">
  <h1 class="page-title">Liste des suggestions</h1>
  <div class="add-container">
    <button class="btn-add" routerLink="/suggestions/AddSuggestion">➕ Ajouter une suggestion</button>
  </div>
  <div class="search-container">
    <input type="text"
           [(ngModel)]="searchText"
           (input)="searchSuggestions()"
           placeholder="Rechercher des suggestions"
           class="search-input">
  </div>
  <div class="suggestions-list">
    <div class="suggestion-card" *ngFor="let s of suggestions">
      <div class="card-header">
        <h2 class="suggestion-title">{{ s.title }}</h2>
        <span class="status-badge" [ngClass]="{
          'status-accepte': s.status === 'acceptee',
          'status-refuse': s.status === 'refusee',
          'status-attente': s.status === 'en_attente'
        }">{{ s.status }}</span>
      </div>
      <div class="card-actions">
        <button class="btn-like" (click)="incrementLikes(s)">👍 Like {{ s.nbLikes }}</button>
        <button class="btn-favorite" (click)="addToFavorites(s)">
          {{ isFavorite(s) ? '⭐ Déjà en favoris' : '🤍 Ajouter aux favoris' }}
        </button>
        <button class="btn-details" [routerLink]="[s.id]">🔍 Details</button>
        <button class="btn-delete" (click)="deleteSuggestion(s.id)">❌ Supprimer</button>
      </div>
    </div>
  </div>
  <div class="no-results" *ngIf="suggestions.length === 0 && searchText.trim() !== ''">
    <p>Aucune suggestion trouvée pour "{{ searchText }}".</p>
  </div>
</div>
